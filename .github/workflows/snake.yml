name: Update contribution trace

"on":
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-trace
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#217b6a&color_dots=#ebedf0,#cbe8dc,#90d3bb,#4cb899,#217b6a
            dist/snake-dark.svg?color_snake=#86e5d0&color_dots=#161b22,#204138,#30675a,#4b9b85,#80d9be
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
